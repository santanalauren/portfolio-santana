<h1>Tem coisa boa tomando forma por aqui.</h1>
<p class="sub">Em breve, projetos, processos e boas ideias. Enquanto isso, passe um café e volte em breve.</p>
<p class="log" id="log" aria-live="polite"></p>

<script>
(()=>{
const LINES=["refinando código","alinhando grids","polindo tipografia","ajustando animações","testando no mobile","compilando componentes","revisando contraste","sincronizando com a vercel"];
const el=document.getElementById("log");
if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=LINES[0];return}
const CH="%$@#&*+=<>/{}[]();01!?",rc=()=>CH[Math.random()*CH.length|0];
const esc=c=>c.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
let i=0,cur="";
function run(target){
 const L=Math.max(cur.length,target.length),t0=performance.now(),rs=[];
 for(let k=0;k<L;k++)rs.push(140+k*45+Math.random()*160);
 const iv=setInterval(()=>{
  const t=performance.now()-t0;let out="",done=true;
  for(let k=0;k<L;k++){
   if(t>=rs[k])out+=esc(target[k]||"");
   else{done=false;out+="<b>"+esc(rc())+"</b>"}
  }
  el.innerHTML=out;
  if(done){clearInterval(iv);cur=target;setTimeout(next,1500)}
 },40);
}
function next(){run(LINES[i++%LINES.length])}
next();
})();
</script>
<script>
(()=>{
const box=document.getElementById("intro"),ia=document.getElementById("ia"),cv=document.getElementById("ic");
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const cx=cv.getContext("2d");
const CH="%$@#&*+=<>/{}[]();01!?",rc=()=>CH[Math.random()*CH.length|0];
function run(){
 const r=box.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),cw=r.width,ch=r.height,LW=Math.round(cw),LH=Math.round(ch),S=4;
 cv.width=cw*dpr;cv.height=ch*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
 const o=document.createElement("canvas");o.width=LW;o.height=LH;const oc=o.getContext("2d");oc.drawImage(ia,0,0,LW,LH);
 const d=oc.getImageData(0,0,LW,LH).data,P=[];
 for(let y=0;y<LH;y+=S)for(let x=0;x<LW;x+=S){
  const i=(y*LW+x)*4;if(d[i+3]<120)continue;
  P.push({hx:x,hy:y,sx:Math.random()*cw,sy:Math.random()*ch,d1:x/LW*260,d2:Math.random()*300,ph:Math.random()*6.28,ch:rc(),red:d[i]>150&&d[i+1]<110});
 }
 const T1=300,T3=1500,TC=2700,cl=u=>Math.max(0,Math.min(1,u)),OUT=u=>1-Math.pow(1-u,3),EASE=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
 ia.style.opacity=0;
 let t0=0,n=0,raf=0;
 const loop=now=>{
  if(!t0)t0=now;const t=now-t0;n++;
  cx.clearRect(0,0,cw,ch);
  const iop=t<TC?0:cl((t-TC)/350);
  ia.style.opacity=iop.toFixed(3);
  const ga=t<T1?0:t<TC?1:cl(1-(t-TC)/350);
  if(ga>0){
   cx.globalAlpha=ga;cx.font="700 7px ui-monospace,Menlo,Consolas,monospace";cx.textAlign="center";cx.textBaseline="middle";
   for(const red of [false,true]){cx.fillStyle=red?"#e60000":"#000";
    for(const p of P){if(p.red!==red)continue;
     let x,y,mv=true;
     if(t<T1+p.d1){x=p.hx;y=p.hy;mv=false}
     else if(t<T3+p.d2){const u=OUT(cl((t-T1-p.d1)/650));x=p.hx+(p.sx-p.hx)*u;y=p.hy+(p.sy-p.hy)*u;if(u>=1){x+=Math.sin(t*.003+p.ph)*3;y+=Math.cos(t*.0027+p.ph)*3}}
     else{const u=EASE(cl((t-T3-p.d2)/800));x=p.sx+(p.hx-p.sx)*u;y=p.sy+(p.hy-p.sy)*u;if(u>=1)mv=false}
     if(mv&&n%4===0)p.ch=rc();
     cx.fillText(p.ch,x,y);
    }}
  }
  cx.globalAlpha=1;
  if(t<TC+400)raf=requestAnimationFrame(loop);else cv.style.display="none";
 };
 raf=requestAnimationFrame(loop);
}
if(ia.complete)run();else ia.onload=run;
})();
</script>
